name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  # No eslint config and no test script exist in this project yet -- this
  # job runs `tsc --noEmit` as the lint/static-check gate (nest build
  # type-checks the whole project) until real lint/test tooling is added.
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: ./package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build
        run: npm run build
