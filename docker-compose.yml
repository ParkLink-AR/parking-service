version: "3.8"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: parking-service-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: parklink
      POSTGRES_PASSWORD: parklink
      POSTGRES_DB: parking_service
    ports:
      - "5432:5432"
    volumes:
      - parking_service_data:/var/lib/postgresql/data

volumes:
  parking_service_data:
